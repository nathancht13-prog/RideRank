kind = "web"
previewPath = "/"
title = "RideRank VTT"
description = "Une landing page interactive en français pour découvrir, classer et voter sur les meilleurs spots et sentiers VTT de la communauté."
version = "1.0.0"
id = "artifacts/riderank"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19876

[services.development]
run = "pnpm --filter @workspace/riderank run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/riderank", "run", "build" ]
serve = "static"
publicDir = "artifacts/riderank/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19876"
BASE_PATH = "/"

kind = "web"
previewPath = "/"
title = "Bike Rank"
description = "Une application VTT mobile-first pour enregistrer ses sorties, progresser dans le classement et trouver des spots adaptés."
version = "1.0.0"
id = "artifacts/riderank"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19876

[services.development]
run = "pnpm --filter @workspace/riderank run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/riderank", "run", "build" ]
serve = "static"
publicDir = "artifacts/riderank/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19876"
BASE_PATH = "/"
